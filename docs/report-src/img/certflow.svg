<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="DejaVu Sans, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker></defs>
  <rect width="1400" height="560" fill="#fff"/>
  <text x="30" y="44" font-size="26" font-weight="bold" fill="#1F2933">Getting a Security Server registered (done for ss1, ss2 and ss3)</text>
  <text x="30" y="74" font-size="17" fill="#4A5563">Every box says where you do it. Steps 2 to 4 run twice: once for the SIGNING key, once for the AUTHENTICATION key.</text>

  <g font-size="16" fill="#333">
    <rect x="30" y="110" width="250" height="150" rx="12" fill="#E3EEF9" stroke="#2B5F96" stroke-width="2"/>
    <text x="48" y="142" font-size="19" font-weight="bold" fill="#2B5F96">1  Initialise</text>
    <text x="48" y="170">on the SS UI:</text><text x="48" y="194">upload anchor, owner,</text><text x="48" y="218">server code, PIN</text>

    <rect x="310" y="110" width="250" height="150" rx="12" fill="#E3EEF9" stroke="#2B5F96" stroke-width="2"/>
    <text x="328" y="142" font-size="19" font-weight="bold" fill="#2B5F96">2  Key + CSR</text>
    <text x="328" y="170">on the SS UI:</text><text x="328" y="194">Keys and Certificates</text><text x="328" y="218">→ Add key → DER CSR</text>

    <rect x="590" y="110" width="250" height="150" rx="12" fill="#F1F3F6" stroke="#5B6573" stroke-width="2"/>
    <text x="608" y="142" font-size="19" font-weight="bold" fill="#333">3  Sign</text>
    <text x="608" y="170">at the test CA:</text><text x="608" y="194" font-family="DejaVu Sans Mono, monospace" font-size="14">localhost:8888/testca</text><text x="608" y="218">Sign or Auth → .pem</text>

    <rect x="870" y="110" width="250" height="150" rx="12" fill="#E3EEF9" stroke="#2B5F96" stroke-width="2"/>
    <text x="888" y="142" font-size="19" font-weight="bold" fill="#2B5F96">4  Import</text>
    <text x="888" y="170">on the SS UI:</text><text x="888" y="194">Import cert;</text><text x="888" y="218">Activate the auth cert</text>

    <rect x="1150" y="110" width="220" height="150" rx="12" fill="#E3EEF9" stroke="#2B5F96" stroke-width="2"/>
    <text x="1168" y="142" font-size="19" font-weight="bold" fill="#2B5F96">5  Register</text>
    <text x="1168" y="170">on the SS UI:</text><text x="1168" y="194">auth cert →</text><text x="1168" y="218">Register → address</text>

    <rect x="870" y="330" width="500" height="120" rx="12" fill="#FFF7D6" stroke="#9A7B00" stroke-width="2"/>
    <text x="888" y="362" font-size="19" font-weight="bold" fill="#7A6100">6  Approve on the Central Server</text>
    <text x="888" y="392">cs UI → Management Requests → Approve</text>
    <text x="888" y="418">(the operator vouches for the server)</text>

    <rect x="310" y="330" width="500" height="120" rx="12" fill="#E4F4EC" stroke="#2E7D55" stroke-width="2"/>
    <text x="328" y="362" font-size="19" font-weight="bold" fill="#2E7D55">7  REGISTERED</text>
    <text x="328" y="392">next global configuration (1–2 min) includes</text>
    <text x="328" y="418">the server and its auth certificate</text>
  </g>
  <g stroke="#1F3A5F" stroke-width="3" marker-end="url(#a)" fill="none">
    <line x1="282" y1="185" x2="306" y2="185"/><line x1="562" y1="185" x2="586" y2="185"/><line x1="842" y1="185" x2="866" y2="185"/><line x1="1122" y1="185" x2="1146" y2="185"/>
    <path d="M1260 262 L1260 326"/><path d="M868 390 L814 390"/>
  </g>
  <text x="30" y="500" font-size="16" fill="#4A5563">ss1's request in step 5 goes straight to the Central Server. ss2's and ss3's go through ss1's management services (see next figure).</text>
  <text x="30" y="528" font-size="16" fill="#4A5563">The SIGNING certificate is usable as soon as it is imported; only the AUTHENTICATION certificate needs registering.</text>
</svg>
