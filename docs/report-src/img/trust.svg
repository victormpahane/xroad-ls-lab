<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B5F96"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D55"/></marker>
  </defs>
  <rect width="1400" height="700" fill="#fff"/>
  <text x="30" y="44" font-size="26" font-weight="bold" fill="#1F2933">Two kinds of trust: global configuration and certificates</text>

  <!-- Central server -->
  <rect x="470" y="80" width="460" height="230" rx="12" fill="#E3EEF9" stroke="#2B5F96" stroke-width="2.5"/>
  <text x="490" y="116" font-size="22" font-weight="bold" fill="#2B5F96">Central Server (cs)</text>
  <text x="490" y="148" font-size="16" fill="#333">Knows: instance LS-DEV, member class GOV,</text>
  <text x="490" y="172" font-size="16" fill="#333">members MCST / MOSD / MOHA and subsystems,</text>
  <text x="490" y="196" font-size="16" fill="#333">trusted CA + OCSP, TSA, Security Servers</text>
  <rect x="490" y="215" width="420" height="78" rx="8" fill="#fff" stroke="#2B5F96"/>
  <text x="506" y="243" font-size="16" font-weight="bold" fill="#1F3A5F">Signs it all with internal-signing-key</text>
  <text x="506" y="270" font-size="15" fill="#333" font-family="DejaVu Sans Mono, monospace">→ published at http://cs/internalconf</text>

  <!-- anchor -->
  <rect x="60" y="120" width="330" height="150" rx="12" fill="#FFF7D6" stroke="#9A7B00" stroke-width="2.5"/>
  <text x="80" y="156" font-size="21" font-weight="bold" fill="#7A6100">Configuration anchor</text>
  <text x="80" y="186" font-size="16" fill="#333">configuration_anchor_LS-DEV.xml</text>
  <text x="80" y="214" font-size="16" fill="#333">= download address</text>
  <text x="80" y="240" font-size="16" fill="#333">+ public key to verify signature</text>
  <line x1="468" y1="195" x2="394" y2="195" stroke="#9A7B00" stroke-width="3" marker-end="url(#a)"/>
  <text x="398" y="182" font-size="14" fill="#7A6100">step 1.8</text>

  <!-- security servers -->
  <g>
    <rect x="160" y="420" width="300" height="110" rx="12" fill="#fff" stroke="#1F3A5F" stroke-width="2"/>
    <text x="180" y="455" font-size="20" font-weight="bold" fill="#1F3A5F">ss1</text>
    <rect x="550" y="420" width="300" height="110" rx="12" fill="#fff" stroke="#2E7D55" stroke-width="2"/>
    <text x="570" y="455" font-size="20" font-weight="bold" fill="#2E7D55">ss2</text>
    <rect x="940" y="420" width="300" height="110" rx="12" fill="#fff" stroke="#B5651D" stroke-width="2"/>
    <text x="960" y="455" font-size="20" font-weight="bold" fill="#B5651D">ss3</text>
    <text x="180" y="485" font-size="15" fill="#333">anchor uploaded at init;</text><text x="180" y="508" font-size="15" fill="#333">downloads conf every ~60 s</text>
    <text x="570" y="485" font-size="15" fill="#333">anchor uploaded at init;</text><text x="570" y="508" font-size="15" fill="#333">downloads conf every ~60 s</text>
    <text x="960" y="485" font-size="15" fill="#333">anchor uploaded at init;</text><text x="960" y="508" font-size="15" fill="#333">downloads conf every ~60 s</text>
  </g>
  <g stroke="#2B5F96" stroke-width="3" marker-end="url(#a)" fill="none">
    <path d="M620 312 L330 416"/><path d="M700 312 L700 416"/><path d="M780 312 L1080 416"/>
  </g>
  <text x="712" y="372" font-size="15" fill="#2B5F96">signed global configuration</text>
  <path d="M225 272 C 225 340, 200 380, 230 416" stroke="#9A7B00" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#a)"/>

  <!-- CA -->
  <rect x="1050" y="80" width="320" height="230" rx="12" fill="#F1F3F6" stroke="#5B6573" stroke-width="2.5"/>
  <text x="1070" y="116" font-size="22" font-weight="bold" fill="#333">Test CA (ca)</text>
  <text x="1070" y="148" font-size="16" fill="#333">Signs each server's CSRs:</text>
  <text x="1070" y="176" font-size="16" fill="#333">• auth cert = who the server is</text>
  <text x="1070" y="202" font-size="16" fill="#333">• sign cert = who the member is</text>
  <text x="1070" y="234" font-size="16" fill="#333">OCSP :8888 says "still valid"</text>
  <text x="1070" y="260" font-size="16" fill="#333">TSA :8899 stamps the logs</text>
  <line x1="1048" y1="160" x2="934" y2="160" stroke="#5B6573" stroke-width="3" marker-end="url(#a)"/>
  <text x="944" y="148" font-size="14" fill="#333">trusted in</text><text x="944" y="186" font-size="14" fill="#333">step 1.3</text>
  <g stroke="#2E7D55" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#g)">
    <path d="M1210 312 C 1210 360, 1150 380, 1120 416"/>
  </g>
  <text x="1220" y="372" font-size="15" fill="#2E7D55">certificates</text>

  <rect x="60" y="580" width="1280" height="90" rx="10" fill="#F7F8FA" stroke="#C9CFD8"/>
  <text x="80" y="614" font-size="17" fill="#1F2933"><tspan font-weight="bold">Why it matters:</tspan> a Security Server believes only configuration signed with the key in its anchor,</text>
  <text x="80" y="644" font-size="17" fill="#1F2933">and only certificates from a CA that this configuration lists. Change either, and the server stops trusting.</text>
</svg>
