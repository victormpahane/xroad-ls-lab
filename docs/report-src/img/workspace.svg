<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1400" height="640" fill="#fff"/>
  <text x="30" y="44" font-size="26" font-weight="bold" fill="#1F2933">Your browser workspace: one tab per server</text>
  <text x="30" y="74" font-size="17" fill="#4A5563">Open these once and keep them open for the whole build. The .lab names keep each admin UI logged in separately.</text>

  <!-- browser frame -->
  <rect x="30" y="100" width="1340" height="510" rx="14" fill="#F7F8FA" stroke="#5B6573" stroke-width="2"/>
  <g font-size="15" font-weight="bold">
    <path d="M50 160 L60 118 L205 118 L215 160 Z" fill="#E3EEF9" stroke="#2B5F96" stroke-width="2"/><text x="72" y="146" fill="#2B5F96">1 cs</text>
    <path d="M215 160 L225 118 L370 118 L380 160 Z" fill="#fff" stroke="#1F3A5F" stroke-width="2"/><text x="237" y="146" fill="#1F3A5F">2 ss1</text>
    <path d="M380 160 L390 118 L535 118 L545 160 Z" fill="#E4F4EC" stroke="#2E7D55" stroke-width="2"/><text x="402" y="146" fill="#2E7D55">3 ss2</text>
    <path d="M545 160 L555 118 L700 118 L710 160 Z" fill="#FBEFE2" stroke="#B5651D" stroke-width="2"/><text x="567" y="146" fill="#B5651D">4 ss3</text>
    <path d="M710 160 L720 118 L865 118 L875 160 Z" fill="#F1F3F6" stroke="#5B6573" stroke-width="2"/><text x="732" y="146" fill="#333">5 test CA</text>
    <path d="M875 160 L885 118 L1030 118 L1040 160 Z" fill="#E4F4EC" stroke="#2E7D55" stroke-width="2"/><text x="897" y="146" fill="#2E7D55">6 portal</text>
    <path d="M1040 160 L1050 118 L1195 118 L1205 160 Z" fill="#FBEFE2" stroke="#B5651D" stroke-width="2"/><text x="1062" y="146" fill="#B5651D">7 audit</text>
  </g>
  <line x1="40" y1="160" x2="1360" y2="160" stroke="#5B6573" stroke-width="2"/>

  <g font-size="16" fill="#1F2933">
    <text x="60" y="205" font-weight="bold" font-size="17">#</text><text x="100" y="205" font-weight="bold" font-size="17">Address</text><text x="470" y="205" font-weight="bold" font-size="17">Login</text><text x="640" y="205" font-weight="bold" font-size="17">What you do there</text>
    <line x1="60" y1="218" x2="1340" y2="218" stroke="#C9CFD8"/>
    <text x="60" y="250">1</text><text x="100" y="250" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">https://cs.lab:4000</text><text x="470" y="250">xrd / secret</text><text x="640" y="250">Central Server: members, trust services, approvals, anchor</text>
    <text x="60" y="292">2</text><text x="100" y="292" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">https://ss1.lab:1000</text><text x="470" y="292">xrd / secret</text><text x="640" y="292">ss1 (MCST): management Security Server</text>
    <text x="60" y="334">3</text><text x="100" y="334" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">https://ss2.lab:2000</text><text x="470" y="334">xrd / secret</text><text x="640" y="334">ss2 (MOSD): consumer, hosts GRANTS-PORTAL</text>
    <text x="60" y="376">4</text><text x="100" y="376" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">https://ss3.lab:3000</text><text x="470" y="376">xrd / secret</text><text x="640" y="376">ss3 (MOHA): provider, publishes the services</text>
    <text x="60" y="418">5</text><text x="100" y="418" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">http://localhost:8888/testca/</text><text x="470" y="418">none</text><text x="640" y="418">Sign certificate requests (CSRs)</text>
    <text x="60" y="460">6</text><text x="100" y="460" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">http://localhost:8500</text><text x="470" y="460">none</text><text x="640" y="460">Grants Portal: run the end-to-end test</text>
    <text x="60" y="502">7</text><text x="100" y="502" font-family="DejaVu Sans Mono, monospace" fill="#2B5F96">http://localhost:8001/audit</text><text x="470" y="502">none</text><text x="640" y="502">Registry audit page: see who called MOHA</text>
  </g>
  <rect x="60" y="530" width="1280" height="60" rx="8" fill="#FFF7D6" stroke="#9A7B00"/>
  <text x="80" y="566" font-size="16" fill="#7A6100"><tspan font-weight="bold">https tabs (1–4):</tspan> the first visit shows a certificate warning. Accept it once per tab (section 3.3). The http tabs (5–7) show no warning.</text>
</svg>
