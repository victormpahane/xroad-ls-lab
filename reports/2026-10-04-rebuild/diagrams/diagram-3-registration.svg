<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4A63"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3A4A63"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B3FA6"/></marker><marker id="ps" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5B3FA6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="gs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2E7D4F"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B26A00"/></marker><marker id="os" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B26A00"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E5597"/></marker><marker id="bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2E5597"/></marker></defs><rect width="1200" height="700" fill="white"/><text x="30" y="42" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#1B2A41">Diagram 3 — How a Security Server joins: registration via ss1</text><text x="30" y="66" font-family="DejaVu Sans" font-size="13" fill="#5B6573">Every registration request travels through the management services hosted on ss1, and is approved on cs</text><g transform="translate(0,-70)"><rect x="60" y="180" width="230" height="120" rx="10" fill="white" stroke="#2E5597" stroke-width="2"/><rect x="60" y="180" width="230" height="6" rx="3" fill="#2E5597"/><text x="175.0" y="226.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#2E5597">ss2 / ss3</text><text x="175.0" y="245.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">new Security Server</text><text x="175.0" y="264.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">AUTH + SIGN keys</text><rect x="470" y="180" width="250" height="120" rx="10" fill="white" stroke="#5B3FA6" stroke-width="2"/><rect x="470" y="180" width="250" height="6" rx="3" fill="#5B3FA6"/><text x="595.0" y="226.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#5B3FA6">ss1</text><text x="595.0" y="245.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">MCST:MANAGEMENT</text><text x="595.0" y="264.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">hosts management services</text><rect x="910" y="180" width="230" height="120" rx="10" fill="white" stroke="#5B3FA6" stroke-width="2"/><rect x="910" y="180" width="230" height="6" rx="3" fill="#5B3FA6"/><text x="1025.0" y="226.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#5B3FA6">cs</text><text x="1025.0" y="245.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">Central Server</text><text x="1025.0" y="264.0" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="12" fill="#5B6573">:4002 managementservice</text><rect x="60" y="470" width="230" height="110" rx="10" fill="white" stroke="#B26A00" stroke-width="2"/><rect x="60" y="470" width="230" height="6" rx="3" fill="#B26A00"/><text x="175.0" y="511.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#B26A00">ca</text><text x="175.0" y="530.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">Test CA</text><text x="175.0" y="549.0" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="12" fill="#5B6573">/testca/sign · OCSP</text><rect x="910" y="470" width="230" height="110" rx="10" fill="white" stroke="#6B7280" stroke-width="2"/><rect x="910" y="470" width="230" height="6" rx="3" fill="#6B7280"/><text x="1025.0" y="511.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#6B7280">Operator</text><text x="1025.0" y="530.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">cs → Management Requests</text><text x="1025.0" y="549.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">Approve</text><rect x="470" y="470" width="250" height="110" rx="10" fill="white" stroke="#5B3FA6" stroke-width="2"/><rect x="470" y="470" width="250" height="6" rx="3" fill="#5B3FA6"/><text x="595.0" y="511.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#5B3FA6">Global configuration</text><text x="595.0" y="530.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#1B2A41">signed by cs, published</text><text x="595.0" y="549.0" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="12" fill="#5B6573">http://cs/internalconf</text><line x1="250" y1="300" x2="250" y2="468" stroke="#B26A00" stroke-width="2.2" marker-end="url(#o)"/><rect x="91.0" y="355.5" width="147.0" height="20.5" rx="4" fill="white" opacity="0.95"/><text x="232" y="370" text-anchor="end" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#B26A00">① CSRs (DER) sent,</text><rect x="74.80000000000001" y="378" width="163.2" height="20" rx="4" fill="white" opacity="0.95"/><text x="232" y="392" text-anchor="end" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#5B6573">signed certs imported</text><line x1="266" y1="468" x2="266" y2="302" stroke="#B26A00" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#o)"/><line x1="290" y1="240" x2="468" y2="240" stroke="#5B3FA6" stroke-width="2.5" marker-end="url(#p)"/><rect x="298.0" y="211.5" width="162.0" height="20.5" rx="4" fill="white" opacity="0.95"/><text x="379" y="226" text-anchor="middle" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#5B3FA6">② register auth cert</text><rect x="324.7" y="248.5" width="108.6" height="19.5" rx="4" fill="white" opacity="0.95"/><text x="379" y="262" text-anchor="middle" font-family="DejaVu Sans" font-size="11.5" font-weight="400" fill="#5B6573">X-Road message</text><line x1="720" y1="240" x2="908" y2="240" stroke="#5B3FA6" stroke-width="2.5" marker-end="url(#p)"/><rect x="725.5" y="211.5" width="177.0" height="20.5" rx="4" fill="white" opacity="0.95"/><text x="814" y="226" text-anchor="middle" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#5B3FA6">③ forwarded over HTTPS</text><rect x="718.3" y="248.5" width="191.4" height="19.5" rx="4" fill="white" opacity="0.95"/><text x="814" y="262" text-anchor="middle" font-family="DejaVu Sans" font-size="11.5" font-weight="400" fill="#5B6573">cs TLS cert trusted on ss1</text><line x1="1025" y1="300" x2="1025" y2="468" stroke="#3A4A63" stroke-width="2.2" marker-end="url(#a)"/><rect x="1029" y="370.5" width="139.5" height="20.5" rx="4" fill="white" opacity="0.95"/><text x="1035" y="385" text-anchor="start" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#1B2A41">④ request WAITING</text><line x1="910" y1="525" x2="722" y2="525" stroke="#5B3FA6" stroke-width="2.2" marker-end="url(#p)"/><rect x="772.5" y="497.5" width="87.0" height="20.5" rx="4" fill="white" opacity="0.95"/><text x="816" y="512" text-anchor="middle" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#5B3FA6">⑤ approved</text><rect x="747.9" y="532.5" width="136.2" height="19.5" rx="4" fill="white" opacity="0.95"/><text x="816" y="546" text-anchor="middle" font-family="DejaVu Sans" font-size="11.5" font-weight="400" fill="#5B6573">config regenerated</text><path d="M470,505 C410,430 360,300 294,282" fill="none" stroke="#5B3FA6" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#p)"/><rect x="419" y="355.5" width="252.0" height="20.5" rx="4" fill="white" opacity="0.95"/><text x="425" y="370" text-anchor="start" font-family="DejaVu Sans" font-size="12.5" font-weight="700" fill="#5B3FA6">⑥ new config downloaded (~1/min)</text><rect x="419" y="378" width="148.79999999999998" height="20" rx="4" fill="white" opacity="0.95"/><text x="425" y="392" text-anchor="start" font-family="DejaVu Sans" font-size="12" font-weight="700" fill="#2E7D4F">→ status REGISTERED</text><rect x="60" y="640" width="1080" height="96" rx="10" fill="#FFF8F0" stroke="#B26A00"/><text x="80" y="668" text-anchor="start" font-family="DejaVu Sans" font-size="13" font-weight="700" fill="#B26A00">Bootstrap (done once on ss1):</text><text x="80" y="690" text-anchor="start" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#1B2A41">MANAGEMENT cannot register itself, because clientReg is one of its own services → first attempt fails with UnknownMember (Figure 4).</text><text x="80" y="710" text-anchor="start" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#1B2A41">Fix: on cs set Management Services' Security Server = SS1; then add the WSDL, set URL https://cs:4002/managementservice/manage/,</text><text x="80" y="728" text-anchor="start" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#1B2A41">upload the cs TLS certificate and grant security-server-owners access (Figures 5–6). After that, ss2 and ss3 registered via ss1.</text></g></svg>